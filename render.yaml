# Render blueprint. Create the service from this file, then fill in the four R2 secrets
# (marked sync: false) in the dashboard - they are the only values Render cannot generate.
databases:
  - name: stampezi-db
    databaseName: stampezi
    plan: free

services:
  - type: web
    name: stampezi-portal
    runtime: ruby
    plan: free
    # Migrate and seed belong in a preDeployCommand, which the free plan does not offer, so
    # they ride along at the end of the build. `&&` throughout: a failed migration must fail
    # the deploy, not ship an app against the wrong schema. db:seed is a no-op once the
    # admin exists.
    buildCommand: >-
      bundle install &&
      bundle exec rails assets:precompile &&
      bundle exec rails assets:clean &&
      bundle exec rails db:migrate &&
      bundle exec rails db:seed
    startCommand: bundle exec puma -C config/puma.rb
    healthCheckPath: /up
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: stampezi-db
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: RAILS_ENV
        value: production
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: ADMIN_TOKEN
        generateValue: true
      # The first deploy seeds this admin, then db:seed is a no-op forever after.
      - key: ADMIN_EMAIL
        value: admin@stampezi.it
      - key: ADMIN_PASSWORD
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        value: stampezi
